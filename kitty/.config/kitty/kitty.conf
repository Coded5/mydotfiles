dynamic_background_opacity yes
background_opacity 0.8

# BEGIN_KITTY_FONTS
font_family      family="D2CodingLigature Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

fallback_family Noto Sans Thai

font_size 12

symbol_map U+0023 Monospace

disable_ligatures cursor

# BEGIN_KITTY_THEME
# Catppuccin-Frappe
include current-theme.conf
# END_KITTY_THEME
